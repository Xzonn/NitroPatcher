name: Build and deploy web

on:
  push:
    branches: [web]
  pull_request:
    branches: [web]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Verify static output
        run: |
          test -s dist/index.html
          test -f dist/.nojekyll
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/web'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs
          path: site
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: dist
      - name: Update docs branch
        run: |
          test -s dist/index.html
          test -f dist/.nojekyll
          rsync -a --delete --exclude=.git dist/ site/
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Deploy web ${GITHUB_SHA}"
            git push origin HEAD:docs
          fi
